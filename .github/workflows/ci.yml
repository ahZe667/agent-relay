name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@localhost:5432/relay
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.9.30/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - name: Unit tests (PostgreSQL)
        run: uv run pytest -q
      - name: Integration test against a running API
        run: |
          uv run uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/ready && break; sleep 1; done
          RELAY_BASE_URL=http://127.0.0.1:8000 uv run pytest -q test_integration.py || { cat uvicorn.log; exit 1; }

  deploy:
    needs: test
    # Only where a local kind cluster exists: act --var DEPLOY_TARGET=kind -s KUBECONFIG="$(kind get kubeconfig --name agent-relay)"
    if: vars.DEPLOY_TARGET == 'kind'
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER: agent-relay
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@v5
      - name: Install kind and kubectl
        run: |
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSLo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${arch}"
          curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/${arch}/kubectl"
          chmod +x /usr/local/bin/kind /usr/local/bin/kubectl
      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBECONFIG_CONTENT" > ~/.kube/config
          kubectl cluster-info
      - name: Build and load image
        run: |
          TAG="ci-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "IMAGE=agent-relay:${TAG}" >> "$GITHUB_ENV"
          docker build -t "agent-relay:${TAG}" .
          kind load docker-image "agent-relay:${TAG}" --name "$KIND_CLUSTER"
      - name: Deploy and wait for rollout
        run: |
          kubectl apply -f k8s/postgres.yaml
          sed "s|image: agent-relay:local|image: ${IMAGE}|" k8s/agent-relay.yaml | kubectl apply -f -
          kubectl rollout status deployment/agent-relay --timeout=180s
